<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TokTik — Videos de prueba</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(circle at 50% 0%, #1b1030 0%, #0b0b0f 60%);
      color: #f2f2f5;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    header { padding: 36px 20px 8px; text-align: center; }
    h1 { margin: 0 0 8px; font-size: 1.6rem; letter-spacing: .2px; }
    header p { margin: 0; color: #a9a9b3; }
    main {
      display: flex;
      flex-wrap: wrap;
      gap: 28px;
      justify-content: center;
      padding: 28px 20px 56px;
    }
    figure { margin: 0; width: min(360px, 90vw); }
    video {
      width: 100%;
      border-radius: 18px;
      background: #000;
      box-shadow: 0 10px 34px #000a;
      display: block;
    }
    figcaption {
      margin-top: 10px;
      text-align: center;
      color: #cfcfd6;
      font-size: .95rem;
    }
    a { color: #25f4ee; }
  </style>
</head>
<body>
  <header>
    <h1>TokTik — Videos de prueba</h1>
    <p>Práctica 04 · Desarrollo Móvil Integral</p>
  </header>
  <main>
    <figure>
      <video controls playsinline preload="metadata" src="1.mp4"></video>
      <figcaption>Video de prueba 1</figcaption>
    </figure>
    <figure>
      <video controls playsinline preload="metadata" src="2.mp4"></video>
      <figcaption>Video de prueba 2</figcaption>
    </figure>
  </main>
</body>
</html>
